[FontCjk]
FontFace=Noto Sans Mono CJK TC
FontSize=22
FontWeight=500
FontWidth=0
FontSpacing=1
FontYOffset=0

;Font for Subtitle(not orignal subtitle)
[FontSubtitle]
FontFace=Noto Sans Mono CJK TC
FontSize=24
FontWeight=500
FontWidth=0
FontSpacing=1
FontYOffset=0

;Font for Newspaper, FontSize in here wont scale, and is not px unit, is lineheight
;38~42 is the range that CJK words wont Reduplicated
[FontNewspaper]
FontFace=Microsoft JhengHei
FontSize=43
FontWeight=500
FontWidth=0
FontSpacing=1
FontYOffset=0

;General Toogle 0 = disable
[General]
NormalFontReplace=1
Utf8ReencodeFix=1
GlyphHook=1
ToUpperHook=1
ZipPathTrace=1

;Debug Toogle 0 = disable
[Debug]
GlyphDiagEnable=0
GlyphDiagCap=2800000
CJKPlaceholderEnable=0
TexUploadDiagEnable=0
LocSwitchDiagEnable=0
ToUpperDiagEnable=0
NativeTexRegDiagEnable=0

DebugSubtitleDiagEnable=0
GlyphOverrunProbe=0

HudDiagEnable=0
MinimapFloorProbe=0
;Inventory/Shop label width fix log toggle
LabelWidthFixDiagEnable=0

DebugZipPathTrace=0
DebugUtf8Decode=0

;Subtitle Position 0,0 = screen left and top
[Subtitle]
BriefingSubtitleEnabled=1
DialogueSubtitleEnabled=1
OnelinersSubtitleEnabled=1
WalkieSubtitleEnabled=1
TvRadioSubtitleEnabled=1
SubtitlePlaceFirst=50.0,85.0
SubtitlePlaceThird=60.0,90.0
NpcHearRadius=1200
TvRadioHearRadius=3000

;Loc Toogle 0 = disable
[LocSwitch]
LocSwitchEnable=1
Hotkey=122

[NewsPaper]
NewsPaperImageWrapFix=1
NewsPaperSpaceAdvanceFix=1
NewsPaperLineHeightFix=1
NewsPaperJustifyFillFix=1
;NewsPaper 0x20 insert to loc string, default = 2
NewsPaperSoftBreakFix=1
SoftBreakCjkInterval=2

;HUD: Pos = screen percent, 0,0 = left/top
[Hud]
TrespassingEnabled=1
TrespassPos=5.0,85
WarningEnabled=1
WarningPos=40.0,5.0

MinimapEnabled=1
;MinimapPos = minimap top-left corner
MinimapPos=3.0,50.0
;MinimapSize = multiplier of a 10x10px base point (side = value*10 px). Integer 0~100; invalid falls back to 15
MinimapSize=20

MinimapZoom=2500
